name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android only for now — Kotlin/Native iOS targets need a macOS
      # runner to compile, and there's no iOS test suite yet either.
      - name: Lint
        run: ./gradlew :composeApp:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug
